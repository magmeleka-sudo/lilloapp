<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LilloApp</title>
<meta name="theme-color" content="#2F6B55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LilloApp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F1; --card:#FFFFFF; --ink:#1D2B36; --muted:#5B6A70; --line:#D6DED8; --track:#E3E9E4;
  --pine:#2F6B55; --on-pine:#FFFFFF; --pine-soft:#DCEBE3;
  --plum:#8A3B5C; --plum-soft:#F4E1E9;
  --honey:#98690F; --honey-fill:#E3B04B; --honey-soft:#F8EDD3;
  --shadow:0 12px 40px rgba(29,43,54,.18);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131A18; --card:#1B2421; --ink:#E6ECE8; --muted:#9CAAA4; --line:#2C3833; --track:#26302C;
    --pine:#74C4A0; --on-pine:#0E1A14; --pine-soft:#1F382D;
    --plum:#E88DB2; --plum-soft:#3B2230;
    --honey:#E9C06A; --honey-fill:#E9C06A; --honey-soft:#3A3120;
    --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131A18; --card:#1B2421; --ink:#E6ECE8; --muted:#9CAAA4; --line:#2C3833; --track:#26302C;
  --pine:#74C4A0; --on-pine:#0E1A14; --pine-soft:#1F382D;
  --plum:#E88DB2; --plum-soft:#3B2230;
  --honey:#E9C06A; --honey-fill:#E9C06A; --honey-soft:#3A3120;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{max-width:100%}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:20px 20px 140px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:1rem;margin:0;color:var(--muted)}
.today-link{background:none;border:0;color:var(--pine);font-weight:700;cursor:pointer;padding:6px 0}
.month{display:flex;align-items:center;gap:6px;margin:10px 0 4px}
.month h2{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,5vw,2rem);margin:0;flex:1;line-height:1.1}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:1.2rem;line-height:1}
.icon-btn:hover{border-color:var(--ink)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:14px 0 24px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 0;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine)}

/* hero */
.hero h3{font-family:var(--display);font-weight:700;font-size:clamp(2rem,7.5vw,3.3rem);line-height:1.04;letter-spacing:-.015em;margin:0 0 10px;max-width:16ch}
.hero p{margin:0 0 6px;color:var(--muted);max-width:60ch}
.hero .flag{color:var(--plum);font-weight:700}
.hero .note{font-size:.9rem}
.bigbar{margin:20px 0 34px}

/* bars */
.bar{position:relative;height:10px;border-radius:5px;background:var(--track)}
.bigbar .bar{height:16px;border-radius:8px}
.fill{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--pine);max-width:100%}
.s-ahead .fill{background:var(--honey-fill)}
.s-over .fill{background:var(--plum)}
.s-none .fill{background:var(--muted);opacity:.5}
.pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.legend{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:6px}

/* category rows */
.cats{list-style:none;margin:0;padding:0}
.cat{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 2px 16px;cursor:pointer;border-radius:0}
.cat:hover .cat-name{text-decoration:underline;text-underline-offset:3px}
.cat-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.cat-name{font-weight:700}
.cat-left{font-weight:700;white-space:nowrap}
.s-over .cat-left{color:var(--plum)}
.s-ahead .cat-left{color:var(--honey)}
.plus{color:var(--pine)} .minus{color:var(--plum)}
.cat-head .cat-left.plus{color:var(--pine)} .cat-head .cat-left.minus{color:var(--plum)}
.cat-insight{font-size:.85rem;color:var(--ink);opacity:.8;margin-top:3px}
.brow-hint{font-size:.85rem;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.add-extra{border-top:1px dashed var(--line)}
.paid-row{display:grid;grid-template-columns:1fr 130px 110px;gap:10px;align-items:center;border-top:1px solid var(--line);padding:9px 2px}
.paid-head{font-size:.85rem;color:var(--muted);font-weight:700;border-top:0;padding-bottom:4px}
.paid-head span:nth-child(n+2){text-align:right}
.paid-name{background:none;border:0;padding:0;font-weight:700;text-align:left;cursor:pointer}
.paid-name:hover{text-decoration:underline;text-underline-offset:3px}
.paid-bud{font-size:.82rem;color:var(--muted)}
.paid-rem{text-align:right;font-weight:700}
.paid .input{min-height:40px;padding-top:7px;padding-bottom:7px}
.paid-total{border-top:2px solid var(--ink);font-weight:700}
@media (max-width:480px){.paid-row{grid-template-columns:1fr 108px 92px;gap:8px}}
.rday{border-top:1px solid var(--line)}
.rday summary{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 2px;cursor:pointer;list-style:none}
.rday summary::-webkit-details-marker{display:none}
.rday-date{font-family:var(--display);font-weight:700;font-size:1.05rem}
.rday-tot{font-weight:700;text-align:right}
.rday-run{grid-column:1/3;font-size:.85rem;color:var(--muted)}
.rday .tx{padding-left:14px;border-top:1px dashed var(--line)}
.signed-out .month,.signed-out .tabs,.signed-out #actions{display:none!important}
.login{max-width:380px;margin:30px 0}
.login-title{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0 0 18px;line-height:1.15}
.cat-sub{font-size:.85rem;color:var(--muted);margin-top:6px}

/* expenses */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day{font-family:var(--display);font-weight:500;font-size:.95rem;color:var(--muted);margin:22px 0 4px}
.tx{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;cursor:pointer}
.tx-desc{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-cat{font-size:.85rem;color:var(--muted);grid-column:1}
.tx-amt{font-weight:700;grid-row:1/3;grid-column:2;text-align:right}
.tx-amt.in{color:var(--pine)}
.who{grid-row:1/3;grid-column:3;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff;background:var(--muted)}
.list-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:2px solid var(--ink);margin-top:8px;padding-top:12px;flex-wrap:wrap}

/* forms */
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:.9rem;font-weight:700;margin-bottom:5px}
.input,select.input,textarea.input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);min-height:46px}
textarea.input{min-height:90px;resize:vertical}
.input:focus{outline:2px solid var(--pine);outline-offset:1px;border-color:transparent}
.money-in{position:relative}
.money-in::before{content:"£";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.money-in .input{padding-left:26px;text-align:right}
.btn{border-radius:10px;border:1px solid var(--ink);background:transparent;padding:11px 18px;font-weight:700;cursor:pointer;min-height:46px}
.btn.primary{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.btn.danger{border-color:var(--plum);color:var(--plum)}
.btn.danger.armed{background:var(--plum);color:var(--card)}
.btn:disabled{opacity:.5;cursor:default}
.btn.link{border:0;padding:8px 0;color:var(--pine);min-height:0;background:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}

/* budget */
.brow{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:center;border-top:1px solid var(--line);padding:10px 2px}
.brow label{font-weight:700}
.btotal{display:flex;justify-content:space-between;border-top:2px solid var(--ink);padding:12px 2px;font-weight:700;font-family:var(--display);font-size:1.2rem}
.callout{background:var(--honey-soft);border-radius:10px;padding:12px 14px;margin:0 0 18px;font-size:.95rem}
details.manage{margin-top:34px;border-top:1px solid var(--line);padding-top:14px}
details.manage summary{cursor:pointer;font-weight:700}
.catedit{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}

/* year */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px}
table.year{border-collapse:collapse;font-size:.85rem;min-width:900px}
table.year th,table.year td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.year th:first-child,table.year td:first-child{text-align:left;position:sticky;left:0;background:var(--paper);font-weight:700}
table.year thead th{color:var(--muted);font-weight:700}
table.year td.over{color:var(--plum);font-weight:700;background:var(--plum-soft)}
table.year tfoot td{border-top:2px solid var(--ink);font-weight:700}
.chart{margin:4px 0 24px}
.quarters{display:flex;gap:8px;margin:12px 0}
.insight{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px;max-width:68ch}
h4.sec{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:34px 0 6px}
.muted{color:var(--muted)}
.empty{padding:30px 0;color:var(--muted);max-width:48ch}

/* bottom actions */
.actions{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.actions .inner{max-width:760px;margin:0 auto;display:flex;gap:10px}
.actions .btn{flex:1}

/* dialogs */
dialog{border:0;border-radius:16px;background:var(--card);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100% - 40px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,20,16,.45)}
.dlg{padding:22px 20px 20px;overflow:auto;max-height:calc(100vh - 60px)}
.dlg h3{font-family:var(--display);font-weight:700;font-size:1.4rem;margin:0 0 16px}
.dlg-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.opt{display:block;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:14px 12px;cursor:pointer;min-height:84px}
.opt:hover{border-color:var(--ink)}
.opt strong{display:block;margin-bottom:2px}
.opt span{display:block;font-size:.85rem;color:var(--muted)}
.opt input{display:none}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;cursor:pointer;margin-bottom:14px}
.drop.on{border-color:var(--pine);background:var(--pine-soft)}
.drop input{display:none}
.files{font-size:.9rem;color:var(--muted);margin:-6px 0 14px}
.rrow{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.rrow.off{opacity:.55}
.rrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--pine)}
.rrow .span2{grid-column:2/4}
.rrow .input{min-height:40px;padding:8px 10px}
.tag{display:inline-block;font-size:.78rem;font-weight:700;border-radius:6px;padding:2px 7px;margin-right:6px}
.tag.dup{background:var(--honey-soft);color:var(--honey)}
.tag.in{background:var(--pine-soft);color:var(--pine)}
.err{color:var(--plum);font-weight:700}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--pine);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:20;max-width:calc(100% - 40px);font-size:.95rem}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
@media (max-width:480px){.brow{grid-template-columns:1fr 128px}.wrap{padding:16px 16px 140px}.scroll-x{margin:0 -16px;padding:0 16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 class="brand">LilloApp</h1>
    <div class="row" style="gap:16px"><button class="today-link" id="todayBtn" hidden>Back to this month</button><button class="today-link" id="signOut" hidden style="color:var(--muted)">Sign out</button></div>
  </div>
  <div class="month">
    <h2 id="monthLabel" class="num">&nbsp;</h2>
    <button class="icon-btn" id="prevBtn" aria-label="Previous month">‹</button>
    <button class="icon-btn" id="nextBtn" aria-label="Next month">›</button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview">Overview</button>
    <button role="tab" data-tab="expenses">Expenses</button>
    <button role="tab" data-tab="budget">Budget</button>
    <button role="tab" data-tab="insights">Insights</button>
    <button role="tab" data-tab="year">Year</button>
  </nav>
  <main id="main"><p class="muted"><span class="spinner"></span>Loading your budget</p></main>
</div>

<div class="actions" id="actions" hidden>
  <div class="inner">
    <button class="btn primary" id="addBtn">Add expense</button>
    <button class="btn" id="importBtn">Scan or import</button>
  </div>
</div>

<dialog id="txDlg"><div class="dlg" id="txBody"></div></dialog>
<dialog id="impDlg"><div class="dlg" id="impBody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  let value;
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'value') value = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  if (value !== undefined) el.value = value;
  return el;
}
const pad = n => String(n).padStart(2, '0');
const gbp = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
const money = n => gbp.format(Math.round((Number(n) || 0) * 100) / 100);
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
function currentYm() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function todayIso() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function shiftYm(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; }
function monthName(ym, opts = { month: 'long', year: 'numeric' }) { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('en-GB', opts); }
function daysIn(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function dayLabel(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
function parseMoney(v) { const n = parseFloat(String(v).replace(/[£,\s]/g, '')); return isFinite(n) ? n : NaN; }
const normKey = s => String(s || '').toLowerCase().replace(/[^a-z]+/g, ' ').trim().split(' ').slice(0, 3).join(' ');
/* Display names only. The stored category name never changes, so old expenses and budgets keep working. */
const CAT_LABELS = { '10%': 'God’s Shares' };
const catLabel = c => CAT_LABELS[c] || c;
/* Merged categories: stored data is never rewritten. On load, each old category is counted under its new home, and budget amounts are added together. */
const CAT_MERGE = { 'council tax': 'Bills', 'clothes - maria': 'Pocket money – Maria', 'clothes - jack': 'Pocket money – Jack' };
const mapCat = c => CAT_MERGE[normName(c)] || c;
function mapAmounts(a) { const out = {}; Object.entries(a || {}).forEach(([k, v]) => { const t = mapCat(k); out[t] = r2((out[t] || 0) + Number(v || 0)); }); return out; }
/* Categories not offered in the pick-a-category lists when adding, scanning or importing (they still exist in Budget, Overview and Expenses). */
const PICK_HIDDEN = ['Rent', 'Savings – Maria', 'Savings – Jack', 'Investing – Maria', 'Investing – Jack', 'Travel savings', 'Loan', 'Pocket money – Maria', 'Pocket money – Jack', '10%', 'Credit Card settlement'].map(c => c.toLowerCase().replace(/[‐-―−]/g, '-'));
const hiddenFromPick = c => PICK_HIDDEN.includes(normName(c));
function listJoin(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
function initials(n) { return String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(''); }
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3800); }
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* ---------- state ---------- */
const S = {
  db: null, user: null, sample: null, downloads: null, uid: null, canWrite: true, ready: false, noDb: false,
  budgetMode: null, expView: recall('expView') || 'table', defaultBudget: {}, prev: null, ym: currentYm(), tab: (recall('tab') === 'reports' ? 'insights' : recall('tab')) || 'overview', insView: recall('insView') || 'daily', pots: null,
  settings: {}, categories: [], settingsLoaded: false, budgets: {}, tx: [], txLoaded: false, merchants: {},
  filter: null, budgetDraft: null, budgetDirty: false,
  year: { y: null, months: null, loading: false }, quarter: null, insights: '', insightBusy: false,
};
let unsubMonth = null;

/* ---------- data ---------- */
/* A month's budget = the default budget, plus that month's own changes and extra categories. */
function budgetFor(ym) {
  const d = S.defaultBudget || {}, m = S.budgets[ym] || {};
  const extra = [...new Set((m.extraCats || []).map(mapCat))].filter(c => !S.categories.includes(c));
  return {
    income: m.income != null ? Number(m.income) || 0 : Number(d.income) || 0,
    amounts: mapAmounts({ ...(d.amounts || {}), ...(m.amounts || {}) }),
    defAmounts: mapAmounts(d.amounts), defIncome: Number(d.income) || 0,
    overrides: mapAmounts(m.amounts), incomeOverride: m.income != null,
    extra, custom: !!S.budgets[ym],
  };
}

/* Pots: running totals, counted from POTS_START, for the categories below. */
const POTS_START = '2026-10';
const POTS = [
  { name: 'Savings – Maria' }, { name: 'Savings – Jack' },
  { name: 'Investing – Maria' }, { name: 'Investing – Jack' },
  { name: 'Travel savings' }, { name: '10%' },

/* In these months, Maria's savings are counted in Jack's savings pot instead of being split. */
const POTS_SAVINGS_ALL_TO_JACK = [];

const potLabel = p => catLabel(p.name);
function potsMonths() { const out = []; for (let ym = POTS_START; ym <= currentYm(); ym = shiftYm(ym, 1)) out.push(ym); return out; }
function potAmounts(ym, tx) {
  const spent = spendingBy(tx), sav = savingsOutcome(ym, spent), sc = savCats();
  const known = [...S.categories, ...Object.keys(spent)];
  const res = {};
  POTS.forEach(p => {
    const c = known.find(k => normName(k) === normName(p.name)) || p.name;
    res[p.name] = sc.includes(c) ? (sav.none ? 0 : sav.eachOf(c)) : (spent[c] || 0);
  });
  if (POTS_SAVINGS_ALL_TO_JACK.includes(ym)) { res['Savings – Jack'] += res['Savings – Maria']; res['Savings – Maria'] = 0; }
  return res;
}

  try {
    const res = await Promise.all(months.map(ym => fetchMonth(ym)));
    if (S.pots === mine) S.pots = { months: months.map((ym, i) => ({ ym, amt: potAmounts(ym, res[i]) })) };
  } catch (e) { if (S.pots === mine) S.pots = { error: true }; }

async function runInsights(q, qMonths, data) {
  S.insightBusy = true; S.insights = 'Thinking…'; render();

  const lines = [];
  qMonths.forEach(ym => {
    const d = data[ym], m = monthName(ym, { month: 'short' });
    if (d.plan.income) lines.push(`${m}: income ${r2(d.plan.income)}, spending budget ${r2(d.plan.expBudget)}, planned savings ${r2(d.plan.savings)}, ${d.sav.final ? 'actual' : 'projected'} savings ${r2(d.sav.total)}`);
  });
  ec.forEach(c => lines.push(`${c}: ` + qMonths.map(ym => `${monthName(ym, { month: 'short' })} budget ${r2(data[ym].plan.amounts[c] || 0)}, spent ${r2(data[ym].spent[c] || 0)}`).join('; ')));

How their budget works: they enter their monthly income, budget each spending category, and whatever income is left is saved automatically, split equally between ${sc.length ? listJoin(sc) : 'their savings'}. So every pound not spent becomes savings. Investing and Travel savings are money set aside, not spending. Rent, loan and council tax are hard to change, so focus ideas elsewhere.

${lines.join('\n')}

Write a short, practical review for them in plain text:
1. How much they saved compared with plan, and which categories' overspending cost them savings.
2. The two or three categories with the most realistic savings potential, each with a concrete suggested new monthly budget and how much more that would add to savings per month.
3. Any category where the budget looks too generous or too tight.
Use short paragraphs, no markdown symbols, no headings or tables. Keep it under 250 words.`;
  try {
    const { text } = await S.sample(prompt, { onText: ({ text }) => { S.insights = text; const el = document.getElementById('insightText'); if (el) el.textContent = text; } });
    S.insights = text;
  } catch (e) {
    S.insights = e.text || '';

        const now = new Date().toISOString();
        if (t.kind === 'setting') await q(sb.from('app_settings').upsert({ key: t.key, value: d, updated_at: now }));
        else if (t.kind === 'budget') await q(sb.from('month_budgets').upsert({ ym: t.ym, income: d.income != null ? d.income : null, amounts: d.amounts || {}, extra_cats: d.extraCats || [], updated_at: now }));
        else await q(sb.from('transactions').upsert(txRow(t.id, d)));
        bump(t.table);
      },
      async delete() {
        if (t.kind === 'setting') await q(sb.from('app_settings').delete().eq('key', t.key));
        else if (t.kind === 'budget') await q(sb.from('month_budgets').delete().eq('ym', t.ym));
        else await q(sb.from('transactions').delete().eq('id', t.id));
        bump(t.table);
      },
    };
  },
  collection(path) {
    const t = parsePath(path);
    return {
      onSnapshot: (cb, err) => watch(t.table, () => fetchColl(t), cb, err),
      get: () => fetchColl(t),
      async add(d) {
        const id = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
        await q(sb.from('transactions').insert(txRow(id, d)));
        bump(t.table);
        return { id };
      },
    };
  },
};
const people = {
  async profiles(ids) {
    const o = {};
    ids.forEach(id => { const p = PEOPLE[id]; o[id] = { name: p ? p.name : String(id).split('@')[0], color: p ? p.color : '#5B6A70', isMe: id === S.uid }; });
    return o;
  },
};
const fileSaver = {
  async save({ filename, data }) {
    const blob = new Blob(['\ufeff' + data], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },
};

/* ---------- sign in ---------- */
function viewLogin() {
  const email = h('input', { class: 'input', type: 'email', autocomplete: 'username', required: true, value: recall('lastEmail') || '' });
  const pw = h('input', { class: 'input', type: 'password', autocomplete: 'current-password', required: true });
  const err = h('p', { class: 'err', role: 'alert' });
  const btn = h('button', { class: 'btn primary', type: 'submit', style: 'width:100%' }, 'Sign in');
  return h('form', { class: 'login', onsubmit: async e => {
      e.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
      store('lastEmail', email.value.trim());
      const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pw.value });
      if (error) { err.textContent = /invalid/i.test(error.message) ? 'That email and password don’t match. Check them and try again.' : error.message; btn.disabled = false; btn.textContent = 'Sign in'; }
    } },
    h('h3', { class: 'login-title' }, 'Sign in to your budget'),
    h('label', { class: 'field' }, h('span', {}, 'Email'), email),
    h('label', { class: 'field' }, h('span', {}, 'Password'), pw),
    err, btn);
}
function showMessage(title, text) {
  $('#main').replaceChildren(h('div', { class: 'empty' }, h('h3', { class: 'login-title' }, title), h('p', {}, text),
    sb ? h('button', { class: 'btn', onclick: () => sb.auth.signOut() }, 'Sign out') : null));
}
let started = false;
async function startApp(session) {
  started = true;
  S.uid = String(session.user.email || '').toLowerCase();
  S.db = db; S.user = people; S.downloads = fileSaver; S.sample = null; S.signedOut = false;
  $('#signOut').hidden = false;
  render();
  let members;
  try { members = await q(sb.from('members').select('email')); }
  catch (e) { showMessage('Couldn’t reach the database', 'Check your internet connection and reload the page. If the database was paused for inactivity, switch it back on in Supabase.'); return; }
  if (!members.length) { showMessage('This login isn’t set up for the budget', `${S.uid} isn’t on the members list. Sign in with one of the two budget emails.`); return; }
  S.ready = true;
  const d = db;
  d.doc('settings/main').onSnapshot(s => {
    const data = s.exists ? s.data() : {};
    if (JSON.stringify(data) !== JSON.stringify(S.settings)) { S.budgetDraft = null; S.budgetDirty = false; }
    S.settings = data; S.categories = [...new Set((data.categories || []).map(mapCat))]; S.settingsLoaded = true; render();
  }, onDbErr);
  d.doc('settings/default').onSnapshot(s => { S.defaultBudget = s.exists ? s.data() : {}; if (!S.budgetDirty) S.budgetDraft = null; render(); }, onDbErr);
  d.doc('settings/merchants').onSnapshot(s => { S.merchants = s.exists ? (s.data().map || {}) : {}; }, () => {});
  d.collection('budgets').onSnapshot(qs => { const b = {}; qs.docs.forEach(x => b[x.id] = x.data()); S.budgets = b; if (!S.budgetDirty) S.budgetDraft = null; render(); }, onDbErr);
  subscribeMonth();
  if (S.tab === 'year') ensureYear();
  sb.channel('budget-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, () => bump('app_settings'))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'month_budgets' }, () => bump('month_budgets'))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, () => { bump('transactions'); S.pots = null; if (S.year.months) S.year.y = null; })
    .subscribe();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) Object.keys(refreshers).forEach(bump); });
}
function init() {
  render();
  if (!window.supabase || !window.supabase.createClient) { showMessage('Couldn’t load', 'Check your internet connection and reload the page.'); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  $('#signOut').onclick = () => sb.auth.signOut();
  sb.auth.onAuthStateChange((event, session) => {
    setTimeout(() => {
      if (session && !started) startApp(session);
      else if (!session && started) location.reload();
      else if (!session) { S.signedOut = true; render(); }
    }, 0);
  });
}
init();
</script>
